[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2.4.1,<3" ]

[project]
name = "keepassdiff"
version = "0.1.12"
description = "A diff/merge tool for KeePassXC databases"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Billy", email = "billydevbusiness@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "pykeepass>=4.1.0.post1,<5",
  "streamlit>=1.40.2,<2",
]


[project.scripts]
keepassdiff = "KeePassDiff.launch:launch"
kpd = "KeePassDiff.launch:launch"
kpdiff = "KeePassDiff.launch:launch"

[tool.poetry]
packages = [
  { include = "KeePassDiff" },
]
